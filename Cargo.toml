[package]
name = "agentjs"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A lightweight JavaScript execution runtime for AI agents"
license = "MIT"

[features]
# Native is always compiled and is the only runtime backend. Boa is available
# only as an external comparison engine via the pinned submodule:
#   cargo build --release --manifest-path boa/Cargo.toml -p boa_cli
default = []

[dependencies]
fancy-regex = "0.18.0"
emojis = "0.9.0"
icu_calendar = { version = "2.2.0", features = ["compiled_data"] }
icu_properties = { version = "2.2.0", features = ["compiled_data"] }
jiff = { version = "0.2.35", features = ["tzdb-bundle-platform"] }
regex = "1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
